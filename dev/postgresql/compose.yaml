name: schemacraft-pg-fixtures

x-fixture: &fixture
  platform: linux/amd64
  restart: "no"
  mem_limit: 512m
  environment:
    POSTGRES_DB: schemacraft_fixture
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${SCHEMACRAFT_PG_FIXTURE_PASSWORD:-SchemaCraftPgFixture!2026}
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d schemacraft_fixture"]
    interval: 2s
    timeout: 3s
    retries: 45

services:
  pg15:
    <<: *fixture
    profiles: [pg15]
    container_name: schemacraft-pg-fixture15
    image: postgres:15.19-bookworm@sha256:d4a8e1f88f475ee3e0137fa89d21ebc59f6c6ab16bf369ee92907607cc3455ae
    ports: ["127.0.0.1:15435:5432"]
    volumes:
      - pg15:/var/lib/postgresql/data
      - ./.generated/tls:/fixture-tls:ro
      - ./init-tls.sh:/docker-entrypoint-initdb.d/00-fixture-tls.sh:ro
      - ../../crates/schemacraft-core/tests/fixtures/postgresql/fixture.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
