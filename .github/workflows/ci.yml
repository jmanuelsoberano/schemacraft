name: CI

# Pull requests run only what their changes need (scripts/ci-changes.sh): a docs-only change
# skips the Rust gates, the build and the smoke test; a change outside the core skips the SQL
# Server integration tests. Pushes to main run everything, which also keeps the build cache warm
# for the next pull request. Each job classifies on its own, so the required checks never report
# a skipped job, which GitHub would count as passed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Lint, test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the changes
        id: changes
        run: bash scripts/ci-changes.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'

      - run: npm ci

      - name: The version in package.json has a dated CHANGELOG entry
        run: node scripts/release-notes.mjs > /dev/null

      - name: Frontend quality gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run docs:check

      - name: Rust quality gates
        if: steps.changes.outputs.code == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Generated TypeScript contracts are up to date
        if: steps.changes.outputs.code == 'true'
        run: git diff --exit-code -- src/shared/contracts/generated

      - name: Build the portable executable
        # The ci profile skips link-time optimisation: half the build time, same behaviour.
        # Releases are built with the full release profile by release.yml.
        if: steps.changes.outputs.code == 'true'
        run: npm run tauri build -- --no-bundle -- --profile ci

      - name: Ensure the WebView2 runtime is installed
        # Hosted Windows runners ship Edge but not always the WebView2 runtime the app needs.
        if: steps.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $version = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          if ($version) { Write-Host "WebView2 runtime $version is installed"; exit 0 }
          Write-Host "WebView2 runtime missing: installing the Evergreen runtime"
          $setup = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/silent", "/install" -Wait
          $version = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          if (-not $version) { throw "the WebView2 runtime did not install" }
          Write-Host "WebView2 runtime $version installed"

      - name: Smoke-test the portable executable
        if: steps.changes.outputs.code == 'true'
        run: node scripts/smoke-test-release.mjs target/ci/schemacraft.exe smoke-test

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.code == 'true'
        with:
          name: schemacraft-windows-x64
          path: target/ci/schemacraft.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: smoke-test-screenshots
          path: smoke-test
          if-no-files-found: error

  # One job with a service per SQL Server version rather than a matrix, whose jobs GitHub names
  # after their values: the branch ruleset requires this check by its name.
  integration:
    name: SQL Server integration tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SchemaCraft!Ci2026"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SchemaCraft!Ci2026' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      # Images from 2019 CU28 on carry mssql-tools18, so the health command is the same.
      mssql2019:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "SchemaCraft!Ci2026"
          MSSQL_PID: Developer
        ports:
          - 1434:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SchemaCraft!Ci2026' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SCHEMACRAFT_TEST_MSSQL_HOST: localhost
      SCHEMACRAFT_TEST_MSSQL_USER: sa
      SCHEMACRAFT_TEST_MSSQL_PASSWORD: "SchemaCraft!Ci2026"
      # A missing server variable fails the tests instead of skipping them.
      SCHEMACRAFT_TEST_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the changes
        id: changes
        run: bash scripts/ci-changes.sh

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        if: steps.changes.outputs.core == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.core == 'true'

      - name: Inspector integration tests on SQL Server 2022
        # sqlserver_permissions and diagnostics_privacy create their own low-privilege logins
        # with a password generated for the run, so no password beyond the service's sa one is
        # configured here. diagnostics_privacy checks that the diagnostic log holds no name of
        # what it reads. A test checks that the server reports the major version named here.
        if: steps.changes.outputs.core == 'true'
        env:
          SCHEMACRAFT_TEST_MSSQL_PORT: "1433"
          SCHEMACRAFT_TEST_MSSQL_MAJOR: "16"
        run: cargo test -p schemacraft-core --test sqlserver_integration --test sqlserver_permissions --test diagnostics_privacy --test sqlserver_code -- --nocapture

      - name: Inspector integration tests on SQL Server 2019
        # Runs after a failure on 2022 as well, so one run reports both versions. It reuses the
        # test binaries the step above built.
        if: ${{ !cancelled() && steps.changes.outputs.core == 'true' }}
        env:
          SCHEMACRAFT_TEST_MSSQL_PORT: "1434"
          SCHEMACRAFT_TEST_MSSQL_MAJOR: "15"
        run: cargo test -p schemacraft-core --test sqlserver_integration --test sqlserver_permissions --test diagnostics_privacy --test sqlserver_code -- --nocapture
