name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, smoke-test and publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No dependency or build caches: a release is built from the repository alone.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install

      - run: npm ci

      - name: The tag is on main, matches both versions and has its CHANGELOG entry
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          package=$(node -p "require('./package.json').version")
          cargo=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [ "v$package" != "$GITHUB_REF_NAME" ] || [ "v$cargo" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $package and Cargo.toml $cargo"
            exit 1
          fi
          node scripts/release-notes.mjs "$package" > "$RUNNER_TEMP/release-notes.md"

      - name: Frontend quality gates
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run docs:check
          npm run distribution:check
          npm run distribution:test

      - name: Rust quality gates
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Generated TypeScript contracts are up to date
        run: git diff --exit-code -- src/shared/contracts/generated

      - name: Build the portable executable and the installer
        run: npm run tauri build

      - name: Ensure the WebView2 runtime is installed
        # Hosted Windows runners ship Edge but not always the WebView2 runtime the app needs.
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $version = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          if ($version) { Write-Host "WebView2 runtime $version is installed"; exit 0 }
          Write-Host "WebView2 runtime missing: installing the Evergreen runtime"
          $setup = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList "/silent", "/install" -Wait
          $version = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
          if (-not $version) { throw "the WebView2 runtime did not install" }
          Write-Host "WebView2 runtime $version installed"

      - name: Smoke-test the portable executable
        run: node scripts/smoke-test-release.mjs target/release/schemacraft.exe smoke-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: smoke-test
          if-no-files-found: error

      - name: Package the release assets
        run: |
          mkdir -p release
          cp target/release/schemacraft.exe "release/schemacraft-$GITHUB_REF_NAME-windows-x64.exe"
          cp target/release/bundle/nsis/*-setup.exe "release/schemacraft-$GITHUB_REF_NAME-windows-x64-setup.exe"
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # What SchemaCraft is, the assets, the code signing policy and the version's CHANGELOG
          # entry (scripts/release-notes.mjs), followed by the generated list of pull requests.
          body_path: ${{ runner.temp }}/release-notes.md
          files: release/*
